name: Apple credential health
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-credential-health
  cancel-in-progress: false
jobs:
  signing:
    if: vars.APPLE_CREDENTIAL_HEALTH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check signing credential and maintain its health issue
        env:
          MACOS_CODE_SIGN_P12_BASE64: ${{ secrets.MACOS_CODE_SIGN_P12_BASE64 }}
          MACOS_CODE_SIGN_P12_PASSWORD: ${{ secrets.MACOS_CODE_SIGN_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import json,os; json.dump({k:os.environ[k] for k in ("MACOS_CODE_SIGN_P12_BASE64","MACOS_CODE_SIGN_P12_PASSWORD","APPLE_TEAM_ID")},__import__("sys").stdout)' |
            python3 bin/dist-tools apple credentials health --issue-repo "$GITHUB_REPOSITORY"
  notary-auth:
    needs: signing
    if: always() && !cancelled() && vars.APPLE_CREDENTIAL_HEALTH_ENABLED == 'true' && vars.APPLE_NOTARY_AUTH_HEALTH_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate identity import and read-only notary authentication
        env:
          MACOS_CODE_SIGN_P12_BASE64: ${{ secrets.MACOS_CODE_SIGN_P12_BASE64 }}
          MACOS_CODE_SIGN_P12_PASSWORD: ${{ secrets.MACOS_CODE_SIGN_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_AUTH_MODE: ${{ vars.APPLE_NOTARY_AUTH_MODE }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import json,os; mode=os.environ.get("APPLE_NOTARY_AUTH_MODE") or "apple-id"; names=["MACOS_CODE_SIGN_P12_BASE64","MACOS_CODE_SIGN_P12_PASSWORD","APPLE_TEAM_ID"]; names += ["APPLE_NOTARY_APPLE_ID","APPLE_NOTARY_PASSWORD"] if mode == "apple-id" else ["APPLE_NOTARY_API_KEY","APPLE_NOTARY_KEY_ID"] + (["APPLE_NOTARY_ISSUER_ID"] if mode == "api-team" else []); json.dump({**{k:os.environ.get(k,"") for k in names},"APPLE_NOTARY_AUTH_MODE":mode},__import__("sys").stdout)' |
            python3 bin/dist-tools apple credentials health --check-notary --issue-repo "$GITHUB_REPOSITORY"
